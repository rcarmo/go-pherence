<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
  <title id="title">Gemma4 CPU performance checkpoints</title>
  <desc id="desc">Line charts comparing initial Q6-fast measurements, a warm Q4 row-kernel control, and the Q4 x4 candidate for 124-token prefill and 48-token decode.</desc>
  <rect width="1100" height="680" fill="#0b1020"/>
  <style>
    text{font-family:Inter,system-ui,sans-serif;fill:#dbe7ff}.muted{fill:#8fa4c7}.grid{stroke:#253451;stroke-width:1}.axis{stroke:#7184a8;stroke-width:1.5}.target{stroke:#f59e0b;stroke-width:2;stroke-dasharray:7 6}.line{fill:none;stroke:#62d6ff;stroke-width:4}.point{fill:#62d6ff;stroke:#0b1020;stroke-width:3}.value{font-size:14px;font-weight:700}.small{font-size:13px}.label{font-size:15px}.panel{fill:#111a30;stroke:#263756;stroke-width:1.5}.gain{fill:#69e6a6}.loss{fill:#ff8d8d}
  </style>
  <text x="55" y="50" font-size="27" font-weight="700">Gemma4 E4B CPU performance checkpoints</text>
  <text x="55" y="78" class="muted" font-size="15">Intel i7-12700 · 6 threads · exact 124-token prefill + 48-token decode harness · tok/s</text>

  <rect class="panel" x="45" y="105" width="1010" height="230" rx="12"/>
  <text x="70" y="137" font-size="19" font-weight="700">Prefill throughput</text>
  <text x="1025" y="137" text-anchor="end" class="loss value">x4 vs warm row: −1.4%</text>
  <line class="grid" x1="100" y1="285" x2="1000" y2="285"/><line class="grid" x1="100" y1="225" x2="1000" y2="225"/><line class="grid" x1="100" y1="165" x2="1000" y2="165"/>
  <text x="88" y="290" text-anchor="end" class="muted small">6</text><text x="88" y="230" text-anchor="end" class="muted small">8</text><text x="88" y="170" text-anchor="end" class="muted small">10</text>
  <line class="axis" x1="100" y1="160" x2="100" y2="290"/><line class="axis" x1="100" y1="290" x2="1000" y2="290"/>
  <path class="line" d="M210 256.3 L550 191.2 L890 195.0"/>
  <circle class="point" cx="210" cy="256.3" r="7"/><circle class="point" cx="550" cy="191.2" r="7"/><circle class="point" cx="890" cy="195.0" r="7"/>
  <text class="value" x="210" y="242" text-anchor="middle">6.958</text><text class="value" x="550" y="177" text-anchor="middle">9.127</text><text class="value" x="890" y="181" text-anchor="middle">9.001</text>
  <text x="1000" y="315" text-anchor="end" class="muted small">98% gate: 438.22 tok/s (off scale)</text>

  <rect class="panel" x="45" y="360" width="1010" height="230" rx="12"/>
  <text x="70" y="392" font-size="19" font-weight="700">Decode throughput</text>
  <text x="1025" y="392" text-anchor="end" class="gain value">x4 vs warm row: +19.2%</text>
  <line class="grid" x1="100" y1="540" x2="1000" y2="540"/><line class="grid" x1="100" y1="480" x2="1000" y2="480"/><line class="grid" x1="100" y1="420" x2="1000" y2="420"/>
  <text x="88" y="545" text-anchor="end" class="muted small">3</text><text x="88" y="485" text-anchor="end" class="muted small">4</text><text x="88" y="425" text-anchor="end" class="muted small">5</text>
  <line class="axis" x1="100" y1="415" x2="100" y2="545"/><line class="axis" x1="100" y1="545" x2="1000" y2="545"/>
  <path class="line" d="M210 511.7 L550 504.6 L890 463.3"/>
  <circle class="point" cx="210" cy="511.7" r="7"/><circle class="point" cx="550" cy="504.6" r="7"/><circle class="point" cx="890" cy="463.3" r="7"/>
  <text class="value" x="210" y="497" text-anchor="middle">3.471</text><text class="value" x="550" y="490" text-anchor="middle">3.590</text><text class="value" x="890" y="449" text-anchor="middle">4.279</text>
  <text x="1000" y="570" text-anchor="end" class="muted small">98% gate: 9.12 tok/s (off scale)</text>

  <text x="210" y="620" text-anchor="middle" class="label">Q6 fast initial</text>
  <text x="550" y="620" text-anchor="middle" class="label">Q4 row control</text>
  <text x="890" y="620" text-anchor="middle" class="label">Q4 output-row x4</text>
  <text x="550" y="651" text-anchor="middle" class="muted small">Warm medians are three end-to-end runs; initial point is the first phase-separated measurement.</text>
</svg>
