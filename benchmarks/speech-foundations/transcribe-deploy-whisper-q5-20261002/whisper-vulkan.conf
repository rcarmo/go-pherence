[Service]
# Whisper ASR on the original-Q5 Vulkan path (Intel iGPU, on demand).
# Vulkan is restricted to the Intel ICD by VK_ICD_FILENAMES in the base unit;
# NVIDIA stays disabled. Shared GPU memory stays resident while the unit runs.
CPUQuota=400%
MemoryMax=8G
MemorySwapMax=0
PrivateDevices=no
Environment=MESA_SHADER_CACHE_DIR=%h/.local/lib/transcribe-web/data/mesa-cache
